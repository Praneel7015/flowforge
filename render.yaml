services:
  - type: web
    name: flowforge-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node server.js
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        value: "https://flowforge.highcortisol.xyz,https://highcortisol.xyz,https://www.highcortisol.xyz,https://flowforge.vercel.app"
      - key: DEFAULT_AI_PROVIDER
        value: groq
      - key: DEFAULT_CICD_PLATFORM
        value: gitlab
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITLAB_WEBHOOK_SECRET
        sync: false
      - key: VERTEX_API_KEY
        sync: false
      - key: VERTEX_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: BEDROCK_ACCESS_KEY_ID
        sync: false
      - key: BEDROCK_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
